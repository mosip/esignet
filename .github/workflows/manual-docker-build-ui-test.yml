name: Manual Docker Build for ui-test

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message for manually triggering'
        required: false
        default: 'Triggered for Updates'
        type: string

  push:
    branches:
      - release*
    paths:
      - 'ui-test/**'
      - '.github/workflows/manual-docker-build-ui-test.yml'

jobs:

  build_maven_ui_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('ui-test/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build with Maven
        run: cd ui-test && mvn -U -B package --file pom.xml
      # ui-test's jar is a plain maven-assembly-plugin jar-with-dependencies,
      # not an executable Spring Boot jar, so it can't reuse kattu's
      # maven-build.yml (that only zips jars with the executable bit set).
      - name: Package jar for docker build
        run: |
          JAR=$(find ui-test/target -maxdepth 1 -name 'uitest-esignet-*-jar-with-dependencies.jar' -type f)
          echo "Found jar: $JAR"
          zip uitest-esignet.zip "$JAR"
      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: uitest-esignet
          path: ./uitest-esignet.zip

  build_docker_ui_test:
    needs: build_maven_ui_test
    strategy:
      matrix:
        include:
          - SERVICE_LOCATION: 'ui-test'
            SERVICE_NAME: 'ui-test'
            BUILD_ARTIFACT: 'uitest-esignet'
      fail-fast: false
    name: ${{ matrix.SERVICE_NAME }}
    uses: mosip/kattu/.github/workflows/docker-build.yml@master
    with:
      SERVICE_LOCATION: ${{ matrix.SERVICE_LOCATION }}
      SERVICE_NAME: ${{ matrix.SERVICE_NAME }}
      BUILD_ARTIFACT: ${{ matrix.BUILD_ARTIFACT }}
      # The Dockerfile installs google-chrome-stable_current_amd64.deb, an
      # amd64-only package, so it can't build under arm64 (QEMU) emulation.
      PLATFORMS: 'linux/amd64'
    secrets:
      DEV_NAMESPACE_DOCKER_HUB: ${{ secrets.DEV_NAMESPACE_DOCKER_HUB }}
      ACTOR_DOCKER_HUB: ${{ secrets.ACTOR_DOCKER_HUB }}
      RELEASE_DOCKER_HUB: ${{ secrets.RELEASE_DOCKER_HUB }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
