worker_processes  2;
worker_rlimit_nofile 65535;

events {
  worker_connections  16384;
  multi_accept on;
}

http {
  log_format perf '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time uct=$upstream_connect_time '
                  'uht=$upstream_header_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log perf buffer=256k flush=10s;
  error_log /var/log/nginx/error.log warn;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;

  upstream esignet_backend {
    server esignet.esignet;
    keepalive           256;
    keepalive_requests  100000;
    keepalive_timeout   60s;
  }

  server {
    listen 3000 reuseport;
    server_name  localhost;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location /v1/esignet/ {
      proxy_pass         http://esignet_backend/;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location /.well-known/openid-configuration {
      proxy_pass         http://esignet_backend/.well-known/openid-configuration;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location /.well-known/jwks.json {
      proxy_pass         http://esignet_backend/oauth2/jwks;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location /.well-known/oauth-authorization-server {
      proxy_pass         http://esignet_backend/.well-known/oauth-authorization-server;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location / {
      # alias /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
