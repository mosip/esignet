# Shared healthcheck timings (merged into each service with <<: *health)
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 30s

# esignet, esignet-ui and ui-test are built from this repo. pull_policy: build rebuilds them on
# every `up` (unchanged layers come from cache), so a stale local image is never reused.

# Every service shares the host network, so `localhost:<port>` is the same address for the
# browser, the test runners and the containers themselves.
services:
  database:
    container_name: postgres-db
    image: "postgres:16-bookworm"
    network_mode: host
    command: postgres -p 5455
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./init-ci.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5455"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-identity-system:
    container_name: mock-id
    image: "mosipqa/mock-identity-system:0.14.x"
    user: root
    network_mode: host
    environment:
      - container_user=mosip
      - active_profile_env=default,local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5455/mosip_mockidentitysystem?currentSchema=mockidentitysystem
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - MOSIP_ESIGNET_HOST=localhost:8080
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/v1/mock-identity-system/actuator/health || exit 1"]

  esignet:
    container_name: esignet-service
    image: "esignet:ci"
    pull_policy: build
    build: ./../esignet-service
    user: root
    network_mode: host
    environment:
      - container_user=mosip
      - PORT=8080
      - LOG_LEVEL=debug
      - DATABASE_HOST=localhost
      - DATABASE_PORT=5455
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - KEYMANAGER_KEYSTORE_TYPE=PKCS12
      - KEYMANAGER_DB_SCHEMA=esignet
      - KEYMANAGER_PKCS12_FILE_PATH=/opt/mosip/test.pfx
      - KEYMANAGER_PKCS12_PASSWORD=localtest
      - KEYMANAGER_PKCS12_ALLOW_INSECURE_SOFTWARE_KEYSTORE=true
      - MOSIP_ESIGNET_CACHE_TYPE=inmemory
      - MOSIP_ESIGNET_HOST=http://localhost:3000
      - MOSIP_ESIGNET_BASE_URL=http://localhost:3000/v1/esignet
      - MOSIP_ESIGNET_OIDC_UI_HOSTNAME=localhost
      - MOSIP_ESIGNET_CAPTCHA_SITE_PROVIDER=hcaptcha
      - MOSIP_ESIGNET_CAPTCHA_SITE_KEY=10000000-ffff-ffff-ffff-000000000001
      - MOSIP_ESIGNET_AUTHN_PROVIDER=mock
      - MOSIP_ESIGNET_MOCK_DOMAIN_URL=http://localhost:8082
    depends_on:
      database:
        condition: service_healthy
      mock-identity-system:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]

  esignet-ui:
    container_name: esignet-ui
    image: oidc-ui:ci
    pull_policy: build
    build: ./../oidc-ui
    user: root
    network_mode: host
    environment:
      - container_user=mosip
      - DEFAULT_LANG=en
      - DEFAULT_WELLKNOWN=%5B%7B%22name%22%3A%22OpenID%20Configuration%22%2C%22value%22%3A%22%2F.well-known%2Fopenid-configuration%22%7D%2C%7B%22name%22%3A%22Jwks%20Json%22%2C%22value%22%3A%22%2F.well-known%2Fjwks.json%22%7D%2C%7B%22name%22%3A%22Authorization%20Server%22%2C%22value%22%3A%22%2F.well-known%2Foauth-authorization-server%22%7D%5D
    volumes:
      - ./nginx-ci.conf:/etc/nginx/nginx.conf
    depends_on:
      esignet:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]

  mock-relying-party-service:
    container_name: mock-rp-service
    image: 'mosipqa/mock-relying-party-service:0.14.x'
    user: root
    network_mode: host
    environment:
      - container_user=mosip
      - ESIGNET_SERVICE_URL=http://localhost:3000/v1/esignet
      - TOKEN_ENDPOINT=/oauth2/token
      - USERINFO_ENDPOINT=/oauth2/userinfo
      - ESIGNET_AUD_URL=http://localhost:3000
      - ESIGNET_PAR_ENDPOINT=http://localhost:3000/v1/esignet/oauth2/par
      - ESIGNET_PAR_AUD_URL=http://localhost:3000
      - REDIRECT_URI=http://localhost:5000/userprofile
      - CLAIMS_USER_PROFILE={"userinfo":{"given_name":{"essential":true},"phone_number":{"essential":true},"email":{"essential":true},"picture":{"essential":true},"gender":{"essential":false},"birthdate":{"essential":false},"address":{"essential":false}},"id_token":{}}
      - CLIENT_PRIVATE_
      - JWE_USERINFO_PRIVATE_
      - USERINFO_RESPONSE_TYPE=jws
      - DISPLAY=page
      - GRANT_TYPE=authorization_code
      - SCOPE_USER_PROFILE=openid profile
      - PROMPT=consent
      - CLIENT_ID=esignet-mock-client
    depends_on:
      esignet:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/ || exit 1"]

  mock-relying-party-ui:
    container_name: mock-rp-ui
    image: 'mosipqa/mock-relying-party-ui:0.14.x'
    user: root
    network_mode: host
    depends_on:
      mock-relying-party-service:
        condition: service_healthy
    environment:
      - container_user=mosip
      - ESIGNET_UI_BASE_URL=http://localhost:3000
      - AUTHORIZE_ENDPOINT=/v1/esignet/oauth2/authorize
      - MOCK_RELYING_PARTY_SERVER_URL=http://localhost:5000/mock-relying-party-service
      - REDIRECT_URI=http://localhost:5000/userprofile
      - CLIENT_ID=esignet-mock-client
      - ACRS=mosip:idp:acr:password%20mosip:idp:acr:generated-code%20mosip:idp:acr:biometrics%20mosip:idp:acr:knowledge
      - CLAIMS_LOCALES=en
      - DISPLAY=page
      - GRANT_TYPE=authorization_code
      - SCOPE_USER_PROFILE=openid profile
      - CLAIMS_USER_PROFILE=%7B%22userinfo%22%3A%7B%22name%22%3A%7B%22essential%22%3Afalse%7D%2C%22phone_number%22%3A%7B%22essential%22%3Atrue%7D%20%7D%2C%22id_token%22%3A%7B%7D%7D
      - CLAIMS_REGISTRATION=%7B%22userinfo%22%3A%7B%22name%22%3A%7B%22essential%22%3Afalse%7D%2C%22phone_number%22%3A%7B%22essential%22%3Atrue%7D%20%7D%2C%22id_token%22%3A%7B%7D%7D
      - PAR_CALLBACK_NAME=get_requestUri
      - PAR_CALLBACK_TIMEOUT=4000
      - DPOP_CALLBACK_NAME=get_dpop_jkt
      - CODE_CHALLENGE=get_code_challenge
    volumes:
      - ./nginx-ci-mock.conf:/etc/nginx/nginx.conf
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/ || exit 1"]

  # ---------------------------------------------------------------------------
  # OpenID Conformance Suite (mongodb + server + httpd), for the apitest
  # `conformance` surface. Definitions mirror api-test/docker-compose.yml; keep the
  # image tag in sync with it (SUITE_IMAGE_TAG).
  #
  # Unlike the services above these run on a bridge network, not the host network:
  # the suite's server listens on 8080, which eSignet already owns on the host, and
  # httpd's nginx resolves its upstream by the name `server`.
  # ---------------------------------------------------------------------------
  conformance-mongodb:
    container_name: conformance-mongodb
    image: ${MONGODB_IMAGE:-mongo:6.0.13}
    networks:
      - conformance
    logging: &suite-logging
      driver: json-file
      options:
        max-size: "500k"
        max-file: "5"

  conformance-server:
    container_name: conformance-server
    image: registry.gitlab.com/openid/conformance-suite:${SUITE_IMAGE_TAG:-release-v5.1.42}
    depends_on:
      - conformance-mongodb
    networks:
      conformance:
        aliases:
          - server
    extra_hosts:
      # Target of the esignet-proxy sidecar below.
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      MONGODB_HOST: conformance-mongodb
      SPRING_PROFILES_ACTIVE: ${SUITE_SPRING_PROFILE:-dev}
      # The dev profile declares optional GitLab/Google login clients that Spring
      # validates eagerly; dummy values let it boot (the harness never uses them).
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITLAB_CLIENTID: unused
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITLAB_CLIENTSECRET: unused
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENTID: unused
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENTSECRET: unused
    logging: *suite-logging

  # eSignet's issuer is http://localhost:3000, so the suite has to dial exactly that
  # address. Inside conformance-server `localhost` is the container itself, so this
  # sidecar shares its network namespace and forwards localhost:3000 to the runner
  # host, where esignet-ui (nginx) is listening. The issuer then needs no rewriting.
  conformance-esignet-proxy:
    container_name: conformance-esignet-proxy
    image: alpine/socat:1.8.0.0
    network_mode: "service:conformance-server"
    restart: unless-stopped
    command: ["TCP-LISTEN:3000,fork,reuseaddr", "TCP:host.docker.internal:3000"]
    logging: *suite-logging

  conformance-httpd:
    container_name: conformance-httpd
    image: registry.gitlab.com/openid/conformance-suite/nginx:${SUITE_IMAGE_TAG:-release-v5.1.42}
    depends_on:
      - conformance-server
    ports:
      - "8443:8443"
    networks:
      conformance:
        aliases:
          - localhost.emobix.co.uk
    logging: *suite-logging

  apitest:
    container_name: apitest
    build: ./../api-test
    image: apitest-esignet:ci
    user: root
    network_mode: host
    depends_on:
      esignet:
        condition: service_healthy
      conformance-httpd:
        condition: service_started
    volumes:
      # Suite plan configs (client ids + private JWKS). The matching public keys are seeded
      # into esignet.client_detail by init-ci.sql. CI-only throwaway keys, never for real use.
      - ./conformance-suite-private:/app/conformance-suite-private:ro
    environment:
      MOSIP_ESIGNET_BASE_URL: http://localhost:3000/v1/esignet
      # apitest is on the host network, so it reaches the suite through the port httpd
      # publishes. localhost.emobix.co.uk resolves to 127.0.0.1 (the workflow also pins it
      # in /etc/hosts so a DNS hiccup cannot break the run).
      CONFORMANCE_BASE_URL: https://localhost.emobix.co.uk:8443
      CONFORMANCE_TLS_VERIFY: 'false'
      SUITE_WAIT_SECONDS: '150'
      CONFIG: /app/data/config/config.mock.json
      # Pin the plan files explicitly so CI does not depend on the file names in config.mock.json.
      PLAN_1_CONFIG_PATH: conformance-suite-private/esignet-config.json
      PLAN_2_CONFIG_PATH: conformance-suite-private/esignet-fapi2-config.json
      REPORT_DIR: /home/esignet/test-report
      ADMIN_TOKEN: local-no-scope
      INDIVIDUAL_ID: 1774231323
      ID_TYPE: uin
      # Without the provisioned plan config the conformance surface reports ENV_NOT_READY;
      # run `APITEST_SURFACES=api,e2e docker compose ... up apitest` to leave it out.
      SURFACES: ${APITEST_SURFACES:-conformance,api,e2e}
      TEST_PROFILE: full
      FLOW_CLIENT_ID: 'esignet-mock-client'
      GODOG_TAGS: '@client-mgmt,@flow-execute,@inactive-client'

  ui-test:
    container_name: uitest
    image: ui-test:ci
    pull_policy: build
    build: ./../ui-test
    user: root
    network_mode: host
    depends_on:
      esignet-ui:
        condition: service_healthy
      mock-relying-party-ui:
        condition: service_healthy
    environment:
      CHROME_DRIVER_CPU_LIMIT: '2'
      CHROME_DRIVER_MEMORY: 3g
      NS: uitestrig
      baseurl: http://localhost:5000/
      eSignetbaseurl: http://localhost:3000/
      emailLoginId: siddhartha.km@gmail.com
      esignetDbUrl: jdbc:postgresql://localhost:5455/mosip_esignet
      esignetDbPassword: postgres
      esignetDbUsername: postgres
      mockUin: '1774231323'
      mosip_testrig_client_secret: 6NUqyav5CYpt5y5p
      oidcClientId: esignet-mock-client
      passwordLoginPassword: Mosip@123
      passwordLoginUin: '1774231323'
      pluginToExecute: mock
      push-reports-to-s3: 'no'
      runLanguage: eng
      runOnBrowserStack: 'false'
      runPrerequisiteSuite: 'false'
      s3-account: uitestrig
      vid: '1774231323'
      uin: '1774231323'
      uinPhoneNumber: '9876543210'

networks:
  conformance: {}
