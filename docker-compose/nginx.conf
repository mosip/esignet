worker_processes  1;

events {
  worker_connections  1024;
}

http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
  server {
    listen 3000;
    server_name  localhost;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location /v1/esignet/ {
      proxy_pass         http://esignet:8080/;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
    location /.well-known/openid-configuration {
      proxy_pass         http://esignet:8080/.well-known/openid-configuration;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
    location /.well-known/jwks.json {
      proxy_pass         http://esignet:8080/oauth2/jwks;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
    location /.well-known/oauth-authorization-server {
      proxy_pass         http://esignet:8080/.well-known/oauth-authorization-server;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # location /oidc-ui {
    #   alias /usr/share/nginx/oidc-ui;
    #   try_files $uri $uri/ /oidc-ui/index.html;
    # }
    location / {
      # alias /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}