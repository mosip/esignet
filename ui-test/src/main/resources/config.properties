# url
baseurl = https://healthservices-go-mosipid1.esqa.mosip.net/

#sampleLocaleUrl = https://sample-mock.es-qa1.mosip.net/
localeUrl = https://esignet-go-mosipid1.esqa.mosip.net/

signupUrl =

# Set false for deployments (e.g. Thunder/eSignet-go) with no Spring actuator - disables all
# eSignet actuator/env calls; callers degrade safely. Leave blank/true when the actuator works.
esignetActuatorEnabled = false

# Whether the eSignet server's identity authenticator is Sunbird RC (true/false). Overrides the
# actuator-based auto-detection - needed when esignetActuatorEnabled=false, since that detection
# can't run at all in that case. Leave blank to auto-detect via the actuator.
sunbirdAuthenticatorActive =

# Whether the eSignet login page requires captcha. Falls back to the actuator when blank and
# esignetActuatorEnabled=true, else defaults false. esignet-go.esqa's reCAPTCHA is a non-enforcing
# dummy per team confirmation, so this stays false.
captchaEnabled = false

# allowed plugin values are (mosipid/mock) - set to skip the eSignet actuator auto-detection call;
# leave blank (or any other value) to auto-detect the plugin from the server's actuator instead
pluginToExecute = mosipid

# Whether to run esignetPrerequisiteSuite.xml/esignetPostrequisiteSuite.xml before/after the
# Cucumber scenarios. Those suites create/delete the partner, policy, certs, API key and default
# OIDC client via PMS on every run (each needing its own Keycloak partner-token call). Set to false
# when the target environment already has all of that provisioned (e.g. a shared esqa environment
# reused across runs). When oidcClientId is set, purpose-type scenarios reuse it (same as mock).
# PAR clients are still created via esignetOidcClientV3Suite.xml (no PMS) even when this is false.
# Leave true/blank otherwise.
runPrerequisiteSuite = false

# Lifetime (seconds) for the signed client_assertion JWT. Falls back to the actuator's
# id-token-expire-seconds when blank; set explicitly for deployments with no actuator.
idTokenExpirySeconds = 3600

# Whether PAR (Pushed Authorization Requests) is supported/required. Falls back to the OIDC
# discovery document when blank - leave blank to auto-detect. Set false for Thunder/eSignet-go
# when the well-known call is unavailable so purpose-type scenarios still open like mock.
parSupported = false
parRequired = false

# Thunder/eSignet-go oauth2 paths. mosipid (pluginToExecute=mosipid) never opens these: login
# starts at baseurl + userprofile (healthservices) and clicks Sign in with eSignet.
esignetWellKnownEndPoint = /v1/esignet/.well-known/oauth-authorization-server
esignetAuthorizeEndpoint = /v1/esignet/oauth2/authorize
esignetParEndpoint = /v1/esignet/oauth2/par

esignetSupportedLanguage = eng

keycloakAuthTokenEndPoint =/auth/realms/mosip/protocol/openid-connect/token
actuatorSignupEndpoint =/v1/signup/actuator/env
uiSpecEndpoint =/v1/signup/registration/ui-spec

# For single browser
browserName=chrome

runLanguage= eng

# For multi-browser execution
runMultipleBrowsers=false
browsers=chrome,edge

# For BrowserStack (required fields)
browserVersion=latest
browserStackOs=Windows
osVersion=10
runOnBrowserStack=false
threadCount=1

# BrowserStack credentials
browserstack_username=mosiptestautomat_i0twsf
browserstack_access_key=qF9z4m5PABzpksZyhopD

# Other flags
# Must stay false for esignet-go.esqa: headless Chrome gets flagged high-risk by the real reCAPTCHA
# and shown the image challenge; a real window passes with just the checkbox. See
# BasePage.solveRecaptchaIfPresent().
headless=false
# Set to yes in the Docker image (entrypoint passes -DrunDocker=yes). Leave blank for local IDE/JAR runs.
runDocker=
mobileEmulation=false
mobileDevice=Pixel 5
# 20s, not the 10s default - initial page render has been observed taking >10s under full-suite load.
explicitWaitTimeout=20

