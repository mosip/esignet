# url
baseurl =

#sampleLocaleUrl = https://sample-mock.es-qa1.mosip.net/
localeUrl =

signupUrl =

# Set to false for deployments (e.g. Thunder/eSignet-go) with no Spring actuator - disables all
# eSignet actuator/env calls; callers degrade safely to their documented fallback. Leave blank/true
# when the actuator is available.
esignetActuatorEnabled = false

# Whether the eSignet server's identity authenticator is Sunbird RC (true/false). Falls back to the
# actuator when blank - set explicitly for deployments with no actuator, where the actuator-only
# detection otherwise always reports false regardless of the real server.
sunbirdAuthenticatorActive =

# Whether the eSignet login page requires captcha. Falls back to the actuator when blank and
# esignetActuatorEnabled=true, else defaults to false.
captchaEnabled = false

# allowed plugin values are (mosipid/mock) - set to skip the eSignet actuator auto-detection call;
# leave blank (or any other value) to auto-detect the plugin from the server's actuator instead
pluginToExecute =

# Whether to run esignetPrerequisiteSuite.xml/esignetPostrequisiteSuite.xml before/after the
# Cucumber scenarios. Set to false when the target environment already has partner/policy/OIDC
# client provisioned. Leave true/blank otherwise.
runPrerequisiteSuite = false

# Lifetime (seconds) for the signed client_assertion JWT. Falls back to the actuator's
# id-token-expire-seconds when blank; set explicitly for deployments with no actuator.
idTokenExpirySeconds = 3600

# Whether PAR (Pushed Authorization Requests) is supported/required. Falls back to the OIDC
# discovery document when blank - leave blank to auto-detect.
parSupported =
parRequired =

# Sunbird RC registry base URL. Required for the CreatePolicySunBirdR/DeletePolicySunBirdR
# prerequisite/postrequisite fixtures and OIDCClientV2SunBird - they self-skip with a clear
# SkipException reason when this is blank.
sunBirdBaseURL =

# eSignet-go (Thunder) discovery/authorize/PAR paths - the classic eSignet paths don't apply there.
# discovery follows RFC 8414 (oauth-authorization-server, not openid-configuration).
# Classic eSignet equivalents (uncomment for a classic deployment):
# esignetWellKnownEndPoint = /v1/esignet/oidc/.well-known/openid-configuration
# esignetAuthorizeEndpoint = /authorize
# esignetParEndpoint = /v1/esignet/oauth/par
esignetWellKnownEndPoint = /v1/esignet/.well-known/oauth-authorization-server
esignetAuthorizeEndpoint = /v1/esignet/oauth2/authorize
esignetParEndpoint = /v1/esignet/oauth2/par

esignetSupportedLanguage =

keycloakAuthTokenEndPoint =/auth/realms/mosip/protocol/openid-connect/token
actuatorSignupEndpoint =/v1/signup/actuator/env
uiSpecEndpoint =/v1/signup/registration/ui-spec

# For single browser
browserName=chrome

runLanguage=

# For multi-browser execution
runMultipleBrowsers=false
browsers=chrome,edge

# For BrowserStack (required fields)
browserVersion=latest
browserStackOs=Windows
osVersion=10
runOnBrowserStack=true
threadCount=1

# BrowserStack credentials
browserstack_username=
browserstack_access_key=

# Other flags
# Headless Chrome can be flagged by a real reCAPTCHA challenge and shown the image challenge instead
# of just the checkbox that a real window gets - set false if a deployment's captcha needs solving.
# See BasePage.solveRecaptchaIfPresent().
headless=true
# Set to yes in the Docker image (entrypoint passes -DrunDocker=yes). Leave blank/no for local IDE/JAR runs.
runDocker=no
mobileEmulation=false
mobileDevice=Pixel 5
# 20s, not the previous 10s default - initial page render has been observed taking >10s under
# full-suite load.
explicitWaitTimeout=20

#properties
eSignetbaseurl =
authorizeUrlTemplate = /v1/esignet/oauth2/authorize?client_id=$CLIENT_ID$&request_uri=$REQUEST_URI$

# Optional KBI field values when the transaction schema is empty. Format: fieldId=value;fieldId=value
kbiLoginValues =

# Consent DB (used by consent-registry scenarios). Host/password stay env-specific;
# name/user/schema are stable across eSignet-go environments. Leave host/password blank to skip.
esignetDbUrl =
esignetDbHost =
esignetDbPort =
esignetDbName = mosip_esignet_go
esignetDbUsername = esignetuser_go
esignetDbPassword =
esignetDbSchema = esignet

# Pre-existing OIDC client for default and purpose-type (non-PAR) scenarios. When set, skips
# client creation and purpose-type scenarios reuse this ID; leave blank to create one per run.
# Optional comma form: primary,secondary.
oidcClientId =

#Ex: Uin=677576500 and Vid=98705032108764
uin =
vid =
#Local number only, no country code - overrides the OTP-login phone when set.
uinPhoneNumber =

# Optional email identifier for OTP login. Leave blank to mark email OTP as N/A.
emailLoginId =

# Login with Password: a separate pre-provisioned identity from the OTP-flow uin above.
passwordLoginUin =
passwordLoginPassword =

# Optional infant identity override; leave blank to use the AddIdentity infant prerequisite.
infantUin =

#Ex: mockUin=677576500
mockUin =

DelayInMilliSecAfterUinGeneration = 90000

# ChromeDriver path used when running inside Docker on Linux
chromeDriverPath=/usr/bin/chromedriver

# Keycloak URL.
keycloak-external-url =

# Set explicitly since apitest-commons' Kernel.properties fallback isn't copied when running
# runners.Runner directly from the IDE, causing a blank realm/client id 401.
keycloak-realm-id = mosip
mosip_testrig_client_id = mosip-testrig-client

#------------------------ secrets and passwords  ------------------------#

#------------------------ Keycloak Passwords ------------------------#
# Used for Keycloak authentication.
keycloak_Password =

#-------- Client Secret Keys ----------#
# These keys are used for various services, make sure to update the values as required when running locally.
mosip_pms_client_secret =
mosip_resident_client_secret =
mosip_idrepo_client_secret =
mosip_admin_client_secret =
mpartner_default_mobile_secret =
mosip_testrig_client_secret =
AuthClientSecret =


#-------- Generic Configuration ----------#

# Enable or disable debugging mode (yes/no).
enableDebug = yes

# Whether to use pre-configured OTP (true/false).
usePreConfiguredOtp =

# Mock Notification Channels (email/phone/email,phone).
mockNotificationChannel =
smtpURL =

#------------------------ Mosip Components Base URLs ------------------------#
# Define base URLs for different components if required.
# Example:
# mosip_components_base_urls = auditmanager=api-internal.qa-base.mosip.net;idrepository=api-internal.qa-base.mosip.net;authmanager=api-internal.qa-base.mosip.net;resident=api-internal.qa-base.mosip.net;partnermanager=api-internal.qa-base.mosip.net;idauthentication=api-internal.qa-base.mosip.net;masterdata=api-internal.qa-base.mosip.net;idgenerator=api-internal.qa-base.mosip.net;policymanager=api-internal.qa-base.mosip.net;preregistration=api-internal.qa-base.mosip.net;keymanager=api-internal.qa-base.mosip.net;mock-identity-system=api.qa-base.mosip.net
# Feel free to add more components as needed.
mosip_components_base_urls =

#------------------------ Module Name Pattern ------------------------#
# Define module name pattern if required.
# Example:
# moduleNamePattern = (mimoto|resident)
# Feel free to add more values as needed.
moduleNamePattern =

#------------------------ Feature File Filter ------------------------#
# Comma-separated list of feature file names (without .feature extension) to execute.
# Example: featureFilesToExecute = ConsentPage,LoginOptions,SignUp
# Leave empty to run ALL feature files.
featureFilesToExecute =

# Cucumber tag filter. Leave empty to run all scenarios (after featureFilesToExecute).
cucumber.filter.tags=

# Run only specific test case(s) by name. Comma-separated; a scenario runs if its name CONTAINS
# any of these (case-insensitive). Leave empty to run all scenarios.
runOnlyScenario =

# Mock MDS (embedded SBI for biometric UI tests - requires local browser)
useMockMds=
# Optional override directory for device-dsk-partner.p12. Leave blank to use ui-test/certs/
# (or the same path bundled inside the shaded JAR on Rancher/CI).
mdsP12Path =

# Biometric device discovery waits (seconds)
biometricScanningWaitSeconds=15
biometricDeviceDiscoveryTimeoutSeconds=60
biometricAuthenticationTimeoutSeconds=60

# MOSIP-24755 / ES-206 / ES-21 Login with Inji automation
injiLinkCodeExpireSeconds=60
injiQrExpiredUiWaitBufferSeconds=90
injiMaxUiWaitSeconds=120
injiServerLinkCodeLimitPerTransaction=10
injiQrAutoRefreshLimit=3
injiActiveLinkCodeQueueSize=2
injiWalletLogoFile=inji_logo.png
injiLinkCodeLimitRedirectAttempt=11

#------------------------ Uncomment for Local Run ------------------------#

# Path to the authentication certificates (if running locally, uncomment the below line and keep the value empty).
authCertsPath =

# X-XSS-Protection: Controls the XSS (Cross-Site Scripting) filter in browsers.
# Values: (yes/no)
xssProtectionCheck = no
