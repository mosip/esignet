                        x-stoplight:
                          id: pkoj6hufcua2e
                  attestation:
                    type: string
                    x-stoplight:
                      id: 0itl6t5pm567h
                    description: Represents the attestation that is the basis of the vouch. Applicable only when evidence type is `vouch`
                  signature_type:
