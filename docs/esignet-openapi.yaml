                          description: 'A boolean value specifying whether the client always uses DPoP for token requests. If omitted, the default value is false. If the value is true, the eSignet rejects token request from the client that do not contain the DPoP header.'
                    encPublicKey:
                      description: |-
                        Encryption public key in JWK format for userinfo JWE encryption.
                        - Set to a valid JWK object to update
                        - Set to null to clear the encryption key
                        - Omit to leave unchanged
                      oneOf:
                        - type: 'null'
                        - title: RSA Encryption Key
                          type: object
                          description: RSA public key for encryption
                          properties:
                            kty:
