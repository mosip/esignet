                            - invalid_client_name
                            - invalid_rp_id
                            - invalid_claim
                            - invalid_acr
                            - invalid_uri
                            - invalid_redirect_uri
                            - invalid_grant_type
                            - invalid_client_auth
                            - invalid_language_code
                            - invalid_client_name_value
                            - invalid_additional_config
                        errorMessage:
                          type: string
              examples:
                Example 1:
                  value:
                    responseTime: '2023-09-22T08:01:13.000Z'
                    response:
                      clientId: WMX5pO6dYdCFR3iaVWGclVPNxTNSADDv
