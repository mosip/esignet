    Purpose:
      type: object
      description: 'Relying Parties should indicate the purpose of using eSignet (e.g., for login, verification) during registration, allowing for specific customisation.'
      properties:
        type:
          type: string
          enum:
            - none
            - verify
            - link
            - login
        title:
          type: object
          description: 'It will appear in the screen as the title of login page. It will be multilingual language map and @none when no language map is present, @none is compulsory if you are providing title object.'
        subTitle:
          type: object
          description: 'It will appear in the screen below the title of login page. It will also be multilingual language map and @none when no language map is present, @none is compulsory if you are providing subTitle object.'
      required:
        - type
    FlowMetadataResponse:
      type: object
      required:
        - isRegistrationFlowEnabled
        - isRecoveryFlowEnabled
        - design
        - i18n
      properties:
        isRegistrationFlowEnabled:
          type: boolean
          description: Indicates if registration flow is enabled for the entity.
          example: true
        isRecoveryFlowEnabled:
          type: boolean
          description: Indicates if recovery flow is enabled for the entity.
          example: true
        application:
          $ref: '#/components/schemas/ApplicationMetadata'
        ou:
          $ref: '#/components/schemas/OUMetadata'
        design:
          $ref: '#/components/schemas/DesignMetadata'
        i18n:
          $ref: '#/components/schemas/I18nMetadata'
    ApplicationMetadata:
      type: object
      description: Application metadata (only present when type=APP).
      properties:
        id:
          type: string
          description: 'Application ID (the OAuth/OIDC `client_id`). Opaque string, not necessarily a UUID.'
        name:
          type: string
          description: Application name.
        description:
          type: string
          description: Application description.
        logoUrl:
          type: string
          format: uri
          description: Application logo URL.
        url:
          type: string
          format: uri
          description: Application URL.
        tosUri:
          type: string
          format: uri
          description: Terms of Service URI.
        policyUri:
          type: string
          format: uri
          description: Privacy Policy URI.
    OUMetadata:
      type: object
      description: |-
        Organization unit metadata.
          - Always present when type=OU
          - For type=APP, only included when the deployment has exactly one OU
      properties:
        id:
          type: string
          format: uuid
          description: Organization unit ID.
        handle:
          type: string
          description: Organization unit handle.
        name:
          type: string
          description: Organization unit name.
        description:
          type: string
          description: Organization unit description.
        logoUrl:
          type: string
          format: uri
          description: Organization unit logo URL.
        tosUri:
          type: string
          format: uri
          description: Terms of Service URI.
        policyUri:
          type: string
          format: uri
          description: Privacy Policy URI.
        cookiePolicyUri:
          type: string
          format: uri
          description: Cookie Policy URI.
    DesignMetadata:
      type: object
      required:
        - theme
        - layout
      properties:
        theme:
          type: object
          description: Resolved theme configuration.
          additionalProperties: true
        layout:
          type: object
          description: Resolved layout configuration.
          additionalProperties: true
    I18nMetadata:
      type: object
      required:
        - languages
        - language
        - translations
      properties:
        languages:
          type: array
          items:
            type: string
          description: List of available languages.
        language:
          type: string
          description: The language used for translations (defaults to 'en' if not specified).
        totalResults:
          type: integer
          description: Total number of translation keys returned.
        translations:
          type: object
          description: Translations organized by namespace.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
    FlowMetaError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: "Error code. Codes follow the FLM-XXXX convention."
          example: FLM-1001
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'
    InitialFlowRequest:
      type: object
      required:
        - applicationId
        - flowType
      properties:
        applicationId:
          type: string
          description: Identifier of the application initiating the flow.
        flowType:
          type: string
          description: Type of the flow to execute.
          enum:
            - AUTHENTICATION
            - REGISTRATION
            - RECOVERY
        verbose:
          type: boolean
          description: 'When true, the response includes the full `data.meta` UI component tree for prompt nodes. eSignet''s UI always sets this to `true`.'
    SubSequentFlowRequest:
      type: object
      required:
        - executionId
      properties:
        executionId:
          type: string
          description: Identifier of an existing flow execution.
        challengeToken:
          type: string
          description: Per-step challenge token received from the previous flow response.
        action:
          type: string
          description: Reference of the action to execute in the flow.
        inputs:
          type: object
          description: Input data provided for the flow step execution.
          additionalProperties:
            type: string
        verbose:
          type: boolean
          description: 'When true, the response includes the full `data.meta` UI component tree for prompt nodes. eSignet''s UI always sets this to `true`.'
    IncompleteFlowResponse:
      type: object
      required:
        - executionId
        - flowStatus
        - type
      properties:
        executionId:
          type: string
          description: Unique identifier of the flow execution.
        flowStatus:
          type: string
          enum:
            - INCOMPLETE
        stepId:
          type: string
          description: Identifier of the current flow step. Not present in eSignet's responses observed to date.
        challengeToken:
          type: string
          description: Per-step challenge token to be included in the next request.
        type:
          type: string
          description: Type of flow step response.
        data:
          allOf:
            - $ref: '#/components/schemas/FlowStepData'
          description: Data for the next step in the flow.
    CompleteFlowResponse:
      type: object
      required:
        - executionId
        - flowStatus
        - assertion
      properties:
        executionId:
          type: string
          description: Unique identifier of the flow execution.
        flowStatus:
          type: string
          enum:
            - COMPLETE
        data:
          type: object
          description: Present as an empty object on completion; reserved for future use.
        assertion:
          type: string
          description: Authentication assertion. This is the JWT to present to "/oauth2/auth/callback".
    ErrorFlowResponse:
      type: object
      required:
        - executionId
        - flowStatus
        - error
      properties:
        executionId:
          type: string
          description: Unique identifier of the flow execution.
        flowStatus:
          type: string
          enum:
            - ERROR
        error:
          $ref: '#/components/schemas/FlowExecutionError'
    FlowStepData:
      type: object
      properties:
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/FlowStepInput'
          description: Required input data for the next flow step.
        redirectURL:
          type: string
          description: Redirect URL for the next step in the flow, if applicable.
        additionalData:
          type: object
          additionalProperties:
            type: string
          description: Additional information provided by the flow step.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/FlowStepAction'
          description: Available actions for the current flow step.
        meta:
          type: object
          description: >-
            Full UI rendering tree for the step (nested `BLOCK`/`STACK`/`TEXT`/`FIELD`/`ACTION`/...
            components), returned because eSignet's UI always sets `verbose: true`. Labels may use
            `{{t(namespace:key)}}` / `{{meta(path)}}` templating resolved via "/flow/meta".
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FlowFieldError'
          description: >-
            Per-field validation failures returned when one or more submitted values violate the
            rules declared on `data.inputs[].validation`. The server discards the submitted values
            for the failing fields and re-presents the same step so the client can re-render the
            form and the user can resubmit corrected values.
    FlowStepAction:
      type: object
      properties:
        ref:
          type: string
          description: Reference name of the action, used for mapping user actions to the flow definition.
        nextNode:
          type: string
          description: Identifier of the next node in the flow to execute when this action is taken.
        type:
          type: string
          description: |-
            Action type forwarded from the PROMPT node definition. Predefined values are `SUBMIT`
            (approve/confirm) and `REJECT` (deny/cancel). Custom strings are also accepted for
            executor-specific routing.
    FlowStepInput:
      type: object
      properties:
        ref:
          type: string
          description: Reference name of the input field, used for mapping user inputs to the meta components.
        identifier:
          type: string
          description: Name of the input field.
        type:
          type: string
          description: Type of the input field.
        required:
          type: boolean
          description: Whether the input is required.
        options:
          type: array
          items:
            type: string
          description: Allowed values for SELECT-type inputs.
        validation:
          type: array
          items:
            $ref: '#/components/schemas/FlowValidationRule'
          description: >-
            Server-enforced validation rules applied to the submitted value after the
            required-input presence check. When any rule fails, the response returns
            `flowStatus: INCOMPLETE` with the failing rules listed under `data.fieldErrors`.
    FlowValidationRule:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Constraint type. Each rule object carries exactly one constraint.
          enum:
            - regex
            - minLength
            - maxLength
        value:
          description: |-
            Constraint parameter. `regex` takes a regex pattern string. `minLength` and
            `maxLength` take a non-negative integer applied to the Unicode code point count of
            the submitted value.
          oneOf:
            - type: string
            - type: integer
              minimum: 0
        message:
          type: string
          description: 'Message returned in `data.fieldErrors` when the rule fails. A flat `namespace.key` i18n key (e.g. `validation.uin.numeric`), resolved via "/flow/meta" — not the `{{t(...)}}` syntax used by `data.meta` labels.'
          example: validation.uin.numeric
    FlowFieldError:
      type: object
      required:
        - identifier
        - message
      properties:
        identifier:
          type: string
          description: Identifier of the input field whose validation rule failed.
        message:
          type: string
          description: 'Message from the failing validation rule. A flat i18n key in `namespace.key` form (e.g. `validation.uin.numeric`).'
          example: validation.uin.numeric
    FlowExecutionError:
      type: object
      properties:
        code:
          type: string
          description: "Error code. Client errors follow the FES-XXXX convention; server errors use SSE-XXXX."
          example: FES-1003
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'
    AuthCallbackRequest:
      type: object
      required:
        - authId
        - assertion
      properties:
        authId:
          type: string
          description: The authorization session identifier returned by the "/authorize" redirect.
        assertion:
          type: string
          description: Signed JWT assertion from the flow engine containing the authentication result.
    AuthCallbackResponse:
      type: object
      required:
        - redirect_uri
      properties:
        redirect_uri:
          type: string
          description: The full redirect URI for the client, including the authorization code and state.
    AuthCallbackError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: OAuth 2.0 error code.
          example: invalid_request
        error_description:
          type: string
          description: Human-readable error description.
    I18nMessage:
      type: object
      description: Internationalized message with translation key and default value.
      required:
        - key
        - defaultValue
      properties:
        key:
          type: string
          description: Translation key for fetching localized message.
        defaultValue:
          type: string
          description: Default message in English (fallback).
