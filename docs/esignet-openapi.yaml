                        minLength: 1
                        maxLength: 50
                    status:
                      type: string
                      enum:
                        - ACTIVE
                        - INACTIVE
                      description: Status of the Client.
                    logoUri:
                      type: string
                      description: Relying party logo URI.
                      format: uri
                    redirectUris:
                      type: array
                      description: Valid list of callback URIs.
                      minItems: 1
                      maxItems: 5
                      uniqueItems: true
                      items:
                        type: string
                        format: uri
                    userClaims:
                      type: array
                      description: Allowed user info claims that can be requested by OIDC client.
                      minItems: 1
                      maxItems: 30
                      uniqueItems: true
                      items:
                        type: string
                        enum:
                          - name
                          - given_name
                          - middle_name
                          - preferred_username
                          - nickname
                          - gender
                          - birthdate
                          - email
                          - phone_number
                          - picture
                          - address
                    authContextRefs:
                      type: array
                      description: Authentication Context Class Reference values.
                      minItems: 1
                      maxItems: 30
                      uniqueItems: true
                      items:
                        type: string
                        enum:
                          - 'mosip:idp:acr:static-code'
                          - 'mosip:idp:acr:generated-code'
                          - 'mosip:idp:acr:linked-wallet'
                          - 'mosip:idp:acr:biometrics'
                          - 'mosip:idp:acr:knowledge'
                          - 'mosip:idp:acr:password'
                          - 'mosip:idp:acr:id-token'
                    grantTypes:
                      type: array
                      description: Form of Authorization Grant presented to token endpoint.
                      minItems: 1
                      maxItems: 3
                      uniqueItems: true
                      items:
                        type: string
                        enum:
                          - authorization_code
                    clientAuthMethods:
                      type: array
                      description: Auth method supported for token endpoint. At present only "private_key_jwt" is supported.
                      minItems: 1
                      maxItems: 3
                      uniqueItems: true
                      items:
                        type: string
                        enum:
                          - private_key_jwt
