        Each relying party can associate with one or more client ids.

        On create, client status will be by default set to "**ACTIVE**".
      operationId: post-oauth-client
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              description: OIDC client details
              required:
                - requestTime
                - request
              properties:
                requestTime:
                  type: string
                  description: Current date and time when the request is sent
                  format: date-time
                  pattern: ''
                request:
                  type: object
                  required:
                    - clientId
                    - clientName
                    - clientNameLangMap
                    - relyingPartyId
                    - logoUri
                    - authContextRefs
                    - publicKey
                    - userClaims
                    - grantTypes
                    - clientAuthMethods
                  properties:
                    clientId:
                      type: string
                      description: 'Unique client id (Case-Sensitive). If duplicates found, request will be rejected.'
                      minLength: 1
                      maxLength: 50
                      examples:
                        - 785b806d0e594657b05aabdb30fff8a4
                    clientName:
