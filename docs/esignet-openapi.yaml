  /oauth2/introspect:
    post:
      tags:
        - OIDC
      summary: Introspect Endpoint
      description: |-
        This endpoint takes an access token or ID token and returns metadata about it. If the token is active, additional data such as scope, client_id, exp, iat, sub, aud, iss and jti is also returned. If the token is invalid, expired, or revoked, the response contains only "active": false. Requires client authentication.

        1. The only supported client authentication method: <b>private_key_jwt</b>
        2. clientAssertion is a signed JWT with the client's private key, corresponding public key should be shared with IdP during the OIDC client registration process.

        **Reference**: https://www.rfc-editor.org/rfc/rfc7662.html
      operationId: post-introspect
      requestBody:
        description: ''
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: An access token or ID token to introspect.
                token_type_hint:
                  type: string
                  description: 'Optional hint about the type of the submitted token. Valid values: access_token, id_token'
                  enum:
                    - access_token
                    - id_token
                client_id:
                  type: string
                  description: Client Id of the OIDC client.
                client_assertion_type:
                  const: 'urn:ietf:params:oauth:client-assertion-type:jwt-bearer'
                  description: Type of the client assertion part of this request.
                client_assertion:
                  type: string
                  description: 'Private key signed JWT, used for client authentication.'
              required:
                - token
                - client_assertion_type
                - client_assertion
            examples:
              Example 1:
                value:
                  token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type_hint: access_token
                  client_id: WMX5pO6dYdCFR3iaVWGclVPNxTNSADDv-kV7VBcnzvY
                  client_assertion_type: 'urn:ietf:params:oauth:client-assertion-type:jwt-bearer'
                  client_assertion: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                    description: Indicates whether the token is currently active.
                  scope:
                    type: string
                  client_id:
                    type: string
                  username:
                    type: string
                  token_type:
                    type: string
                  exp:
                    type: integer
                    format: int64
                  iat:
                    type: integer
                    format: int64
                  nbf:
                    type: integer
                    format: int64
                  sub:
                    type: string
                  aud:
                    description: Audience — may be a string or an array of strings.
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  iss:
                    type: string
                  jti:
                    type: string
                required:
                  - active
              examples:
                active:
                  summary: Active token
                  value:
                    active: true
                    scope: openid profile
                    client_id: WMX5pO6dYdCFR3iaVWGclVPNxTNSADDv-kV7VBcnzvY
                    token_type: Bearer
                    exp: 1735689600
                    iat: 1735686000
                    sub: PVRmfDpgZJqvLMfYq6pqB-L3YA6WGwXflbNRiUazLrc
                    iss: 'https://esignet.collab.mosip.net/v1/esignet'
                inactive:
                  summary: Inactive or expired token
                  value:
                    active: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                  - error_description
      security: []
      servers:
        - url: 'https://esignet.collab.mosip.net/v1/esignet'

tags:
  - name: Management
    description: Management level API's used for internal use.
  - name: OIDC
