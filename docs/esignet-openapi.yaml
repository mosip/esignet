        description: Partial update request - only include fields to update
        content:
          application/json:
            schema:
              type: object
              required:
                - requestTime
                - request
              properties:
                requestTime:
                  type: string
                  description: Current date and time when the request is sent
                request:
                  type: object
                  description: All fields are optional. Only provided fields will be updated.
