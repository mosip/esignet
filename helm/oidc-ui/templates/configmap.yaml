apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "common.names.fullname" . }}-nginx-cm
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  nginx.conf: |-
    worker_processes  2;
    worker_rlimit_nofile 65535;

    events {
      worker_connections  16384;
      multi_accept on;
    }

    http {
      log_format perf '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';
      access_log /var/log/nginx/access1.log perf buffer=256k flush=10s;
      error_log /var/log/nginx/error.log warn;

      sendfile        on;
      tcp_nopush      on;
      tcp_nodelay     on;
      keepalive_timeout 65;

      upstream esignet_backend {
        server {{ .Values.oidc_ui.oidc_service_host }};
        keepalive           256;
        keepalive_requests  100000;
        keepalive_timeout   60s;
      }

      server {
        listen {{ .Values.oidc_ui.oidc_ui_port }} reuseport;
        server_name  localhost;
        server_tokens off;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        location /v1/esignet/ {
          proxy_pass         http://esignet_backend/;
          proxy_http_version 1.1;
          proxy_set_header   Connection "";
          proxy_redirect     off;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Host $server_name;
          add_header Content-Security-Policy "default-src 'none'" always;
          add_header Referrer-Policy "no-referrer" always;
        }

        location /v1/esignet/actuator/ {
          proxy_pass         http://esignet_backend/;
          proxy_http_version 1.1;
          proxy_set_header   Connection "";
          proxy_redirect     off;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Host $server_name;
          add_header Content-Security-Policy "default-src 'none'" always;
          add_header Referrer-Policy "no-referrer" always;
        }

        location /.well-known/jwks.json {
          proxy_pass         http://esignet_backend/oauth2/jwks;
          proxy_http_version 1.1;
          proxy_set_header   Connection "";
          proxy_redirect     off;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Host $server_name;
          add_header Content-Security-Policy "default-src 'none'" always;
          add_header Referrer-Policy "no-referrer" always;
          types {
            text/plain log cer json txt;
          }
        }

        location /.well-known/openid-configuration {
          proxy_pass         http://esignet_backend/.well-known/openid-configuration;
          proxy_http_version 1.1;
          proxy_set_header   Connection "";
          proxy_redirect     off;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Host $server_name;
          add_header Content-Security-Policy "default-src 'none'" always;
          add_header Referrer-Policy "no-referrer" always;
          types {
            text/plain log cer json txt;
          }
        }

        location /.well-known/oauth-authorization-server {
          proxy_pass         http://esignet_backend/.well-known/oauth-authorization-server;
          proxy_http_version 1.1;
          proxy_set_header   Connection "";
          proxy_redirect     off;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Host $server_name;
          add_header Content-Security-Policy "default-src 'none'" always;
          add_header Referrer-Policy "no-referrer" always;
          types {
            text/plain log cer json txt;
          }
        }


        location / {
          try_files $uri $uri/ /index.html;
          add_header Content-Security-Policy "
            default-src 'self';
            style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
            font-src 'self' https://fonts.gstatic.com;
            img-src 'self' data: https://cdn.jsdelivr.net https://*.mosip.net;
            script-src 'self' https://www.google.com  https://www.gstatic.com;
            frame-src https://www.google.com;
            connect-src 'self' http://127.0.0.1:*;
          " always;
          add_header Referrer-Policy "no-referrer" always;
        }
      }
    }
{{- if .Values.oidc_ui.configmaps }}
  {{- range $cm_name, $cm_value := .Values.oidc_ui.configmaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cm_name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "common.labels.standard" $ | nindent 8 }}
    {{- if $.Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" $.Values.commonLabels "context" $ ) | nindent 8 }}
    {{- end }}
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $.Values.commonAnnotations "context" $ ) | nindent 8 }}
  {{- end }}
data:
  {{- range $key, $value := $cm_value }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
  {{- end }}